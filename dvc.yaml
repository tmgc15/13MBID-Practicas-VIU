stages:
  preparar_datos:
    cmd: uv run python src/procesar_datos.py
    deps:
    - data/raw/datos_clientes.csv
    - data/raw/datos_resenas.csv
    - src/procesar_datos.py
    outs:
    - data/processed/datos_integrados.csv
  entrenar_modelo:
    cmd: uv run python src/entrenar_modelo.py
    deps:
    - data/processed/datos_integrados.csv
    - src/entrenar_modelo.py
    outs:
    - models/modelo_sentimientos.pkl
    - reports/metricas_entrenamiento.csv
  evaluar_modelo:
    cmd: uv run python -m pytest tests/test_modelo.py -v
    deps:
    - models/modelo_sentimientos.pkl
    - reports/metricas_entrenamiento.csv
    - tests/test_modelo.py
